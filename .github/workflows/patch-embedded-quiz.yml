name: Patch Embedded Quiz Entry

on:
  push:
    branches: [ "feature/embed-quiz-bank" ]
    paths:
      - ".github/workflows/patch-embedded-quiz.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect quiz tab to internal activity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ruisi/changanmatch/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          old = '''        TextView description = text(
                  "顶部切换入口已经按原方案保留。答题器使用本地题库和屏幕识别，不上传题目内容。",
                  14, TEXT_MUTED);
          description.setGravity(Gravity.CENTER);
          description.setLineSpacing(0, 1.2f);
          description.setPadding(0, dp(10), 0, dp(15));
          card.addView(description, fullWidth());

          Button openButton = primaryButton("启动题库答题器");
          openButton.setOnClickListener(v -> openQuizAssistant());
          card.addView(openButton, buttonParams());

          TextView note = text(
                  "答题时会打开本机题库识别组件；返回本应用后仍可在顶部继续切换消消乐和卡密页面。",
                  13, TEXT_MUTED);
          note.setGravity(Gravity.CENTER);
          note.setPadding(dp(5), dp(10), dp(5), 0);
          card.addView(note, fullWidth());
      }

      private void openQuizAssistant() {
          Intent launch = getPackageManager().getLaunchIntentForPackage("com.ruisi.changanquiz");
          if (launch == null) {
              Toast.makeText(this, "未检测到题库答题器组件，请先安装题库模块", Toast.LENGTH_LONG).show();
              return;
          }
          startActivity(launch);
      }
'''
          new = '''        TextView description = text(
                  "已内置 3603 道《长安幻想》题库和中文 OCR。识题、查题和答案匹配全部在手机本地完成，不上传题目内容。",
                  14, TEXT_MUTED);
          description.setGravity(Gravity.CENTER);
          description.setLineSpacing(0, 1.2f);
          description.setPadding(0, dp(10), 0, dp(12));
          card.addView(description, fullWidth());

          TextView bankState = text("题库状态：已内置 3603 道", 13, GREEN);
          bankState.setGravity(Gravity.CENTER);
          bankState.setPadding(dp(10), dp(6), dp(10), dp(6));
          bankState.setBackground(roundRect(Color.rgb(237, 249, 242), 15));
          card.addView(bankState, withMargins(fullWidth(), dp(4)));

          Button openButton = primaryButton("进入内置答题器");
          openButton.setOnClickListener(v -> openQuizAssistant());
          card.addView(openButton, buttonParams());

          TextView note = text(
                  "进入后可先输入“浪里白条”手动测试，也可授权悬浮窗并启动屏幕识题。无需安装第二个 App。",
                  13, TEXT_MUTED);
          note.setGravity(Gravity.CENTER);
          note.setPadding(dp(5), dp(10), dp(5), 0);
          card.addView(note, fullWidth());
      }

      private void openQuizAssistant() {
          startActivity(new Intent(this, QuizActivity.class));
      }
'''
          if old not in text:
              raise SystemExit('Expected quiz entry block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ruisi/changanmatch/MainActivity.java
          git commit -m "Use embedded 3603-question quiz activity"
          git push origin HEAD:${GITHUB_REF_NAME}
