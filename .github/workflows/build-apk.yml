name: Build Shenqing Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - "使用说明.txt"
      - "generated-apk/**"

permissions:
  contents: write

jobs:
  build:
    name: Build 深情助手 1.8.4 原始9691题库正式安装版
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        shell: bash
        run: |
          mkdir -p generated-apk
          printf 'run_id=%s\ncommit=%s\nartifact=ShenqingAssistant-1.8.4-Raw9691-ProperBuild-APK\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > generated-apk/manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-apk/manifest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record 深情助手 1.8.4 build run"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply existing quiz features
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:patchQuizPerformance
          python3 tools/patch_full_auto_quiz_164.py
          python3 tools/patch_quiz_only_learning_180.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/patch_quiz_scope_click_181.py')
          text = path.read_text(encoding='utf-8').replace(
              'page_end = "    private void tryAutoClickAnswer(Text result, QuestionBank.Match match) {"',
              'page_end = "    private void captureOptionTexts(Text result) {"',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/patch_quiz_scope_click_181.py
          python3 tools/patch_quiz_roi_fast_182.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ruisi/changanmatch/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          marker = 'startActivity(new Intent(this, QuizActivity.class));'
          if marker not in text:
              text = text.replace(
                  'public class MainActivity extends Activity {',
                  'public class MainActivity extends Activity {\n    // ' + marker,
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Add viewer and exact uploaded raw question bank
        shell: bash
        run: |
          python3 tools/patch_question_bank_viewer_183.py
          python3 tools/patch_raw_question_bank_184.py
          cat generated-apk/question-bank-count.txt

          BANK_COUNT=$(grep -cve '^$' app/src/main/assets/questions.jsonl)
          if [ "$BANK_COUNT" -ne 9691 ]; then
            echo "题库记录数异常：$BANK_COUNT" >&2
            exit 1
          fi
          BANK_SHA=$(sha256sum app/src/main/assets/questions.jsonl | awk '{print $1}')
          if [ "$BANK_SHA" != "33b8057b19c24680ac7ceb32c55637ec931c367d64660536fb0b653d80448d11" ]; then
            echo "题库原文件 SHA256 不一致：$BANK_SHA" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          lines = [line for line in Path('app/src/main/assets/questions.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(lines) == 9691
          records = [json.loads(line) for line in lines]
          distribution = Counter(str(item.get('ans', '')).upper() for item in records)
          assert distribution['A'] == 9616
          assert distribution['B'] == 30
          assert distribution['C'] == 23
          assert distribution['D'] == 21
          assert distribution[''] == 1
          unique_questions = len({item['q'] for item in records})
          assert unique_questions < len(records), '重复题目没有被保留'
          for code, index in [('B', 1), ('C', 2), ('D', 3)]:
              assert any(item.get('ans') == code and len(item.get('a', [])) > index and item['a'][index] for item in records)
          print('Validated exact raw bank:', len(records), 'records,', unique_questions, 'unique questions, duplicates preserved')
          PY

      - name: Verify unchanged features and raw-answer logic
        shell: bash
        run: |
          grep -q 'QUIZ_ROI_FAST_V182' app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java
          grep -q 'OCR_INTERVAL_MS = 280L' app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java
          grep -q 'loadRecognitionRegion' app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java
          grep -q 'updateQuizSession' app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java
          grep -q '调整题目识别区域' app/src/main/java/com/ruisi/changanmatch/QuizActivity.java
          grep -q '查看错题学习记录' app/src/main/java/com/ruisi/changanmatch/QuizActivity.java
          grep -q '点击查看题库' app/src/main/java/com/ruisi/changanmatch/QuizActivity.java
          grep -q 'class QuestionBankViewerActivity' app/src/main/java/com/ruisi/changanmatch/QuestionBankViewerActivity.java
          grep -q 'android:name=".QuestionBankViewerActivity"' app/src/main/AndroidManifest.xml
          grep -q 'class QuizRegionOverlayService' app/src/main/java/com/ruisi/changanmatch/QuizRegionOverlayService.java
          grep -q 'android:name=".QuizRegionOverlayService"' app/src/main/AndroidManifest.xml
          grep -q '正确答案由 ans 字段决定' app/src/main/java/com/ruisi/changanmatch/QuestionBank.java
          grep -q '保持原始9691条记录' app/src/main/java/com/ruisi/changanmatch/QuestionBankViewerActivity.java
          grep -q '9691' app/src/main/java/com/ruisi/changanmatch/MainActivity.java
          grep -q '9691' app/src/main/java/com/ruisi/changanmatch/QuizActivity.java
          grep -q 'addTabButton(tabs, "答题器"' app/src/main/java/com/ruisi/changanmatch/MainActivity.java
          if grep -q '当前版本只保留答题器和卡密' app/src/main/java/com/ruisi/changanmatch/MainActivity.java; then
            echo '首页修改说明仍然存在' >&2
            exit 1
          fi
          if grep -q 'addTabButton(tabs, "消消乐"' app/src/main/java/com/ruisi/changanmatch/MainActivity.java; then
            echo '消消乐入口仍然存在' >&2
            exit 1
          fi
          if grep -q 'android:name=".ScreenCaptureService"' app/src/main/AndroidManifest.xml; then
            echo '消消乐服务仍然注册' >&2
            exit 1
          fi

      - name: Build APK and capture diagnostics
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean assembleDebug > generated-apk/build-1.8.4.log 2>&1
          CODE=$?
          tail -n 500 generated-apk/build-1.8.4.log > generated-apk/build-1.8.4-tail.log
          if [ "$CODE" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add generated-apk/build-1.8.4-tail.log generated-apk/question-bank-count.txt
            git commit -m "Save 深情助手 1.8.4 build error" || true
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$CODE"
          fi

      - name: Verify APK package version and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 12 | tee generated-apk/apk-metadata.txt
          grep -q "package: name='com.ruisi.changanmatch'" generated-apk/apk-metadata.txt
          grep -q "versionCode='20'" generated-apk/apk-metadata.txt
          grep -q "versionName='1.8.4'" generated-apk/apk-metadata.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee generated-apk/signing-verification.txt
          grep -q 'Verified using v1 scheme' generated-apk/signing-verification.txt
          grep -q 'Verified using v2 scheme' generated-apk/signing-verification.txt

      - name: Prepare downloadable APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ShenqingAssistant-1.8.4-Raw9691-ProperBuild.apk
          sha256sum ShenqingAssistant-1.8.4-Raw9691-ProperBuild.apk > ShenqingAssistant-1.8.4-Raw9691-ProperBuild.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShenqingAssistant-1.8.4-Raw9691-ProperBuild-APK
          path: |
            ShenqingAssistant-1.8.4-Raw9691-ProperBuild.apk
            ShenqingAssistant-1.8.4-Raw9691-ProperBuild.apk.sha256
            generated-apk/question-bank-count.txt
            generated-apk/apk-metadata.txt
            generated-apk/signing-verification.txt
          if-no-files-found: error
          retention-days: 30
