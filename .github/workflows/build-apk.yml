name: Build Shenqing Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - "使用说明.txt"
      - "generated-apk/**"

permissions:
  contents: write

jobs:
  build:
    name: Build 深情助手 1.6.0
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        shell: bash
        run: |
          mkdir -p generated-apk
          printf 'run_id=%s\ncommit=%s\nartifact=ShenqingAssistant-1.6.0-APK\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > generated-apk/manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-apk/manifest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record 深情助手 1.6.0 build run"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ShenqingAssistant-1.6.0-debug.apk
          sha256sum ShenqingAssistant-1.6.0-debug.apk > ShenqingAssistant-1.6.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShenqingAssistant-1.6.0-APK
          path: |
            ShenqingAssistant-1.6.0-debug.apk
            ShenqingAssistant-1.6.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
