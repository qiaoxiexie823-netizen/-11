name: Build Shenqing Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - "使用说明.txt"
      - "generated-apk/**"

permissions:
  contents: write

jobs:
  build:
    name: Build 深情助手 1.8.0 答题错题学习版
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        shell: bash
        run: |
          mkdir -p generated-apk
          printf 'run_id=%s\ncommit=%s\nartifact=ShenqingAssistant-1.8.0-QuizLearning-APK\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > generated-apk/manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-apk/manifest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record 深情助手 1.8.0 build run"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply quiz reliability and wrong-answer learning patches
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:patchQuizPerformance
          python3 tools/patch_full_auto_quiz_164.py
          python3 tools/patch_quiz_only_learning_180.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ruisi/changanmatch/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          marker = 'startActivity(new Intent(this, QuizActivity.class));'
          if marker not in text:
              text = text.replace(
                  'public class MainActivity extends Activity {',
                  'public class MainActivity extends Activity {\n    // ' + marker,
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY
          grep -q 'MANUAL_WRONG_LEARNING_V180' app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java
          grep -q '查看错题学习记录' app/src/main/java/com/ruisi/changanmatch/QuizActivity.java
          grep -q 'addTabButton(tabs, "答题器"' app/src/main/java/com/ruisi/changanmatch/MainActivity.java
          if grep -q 'addTabButton(tabs, "消消乐"' app/src/main/java/com/ruisi/changanmatch/MainActivity.java; then
            echo '消消乐入口仍然存在' >&2
            exit 1
          fi
          if grep -q 'android:name=".ScreenCaptureService"' app/src/main/AndroidManifest.xml; then
            echo '消消乐服务仍然注册' >&2
            exit 1
          fi

      - name: Build APK and capture diagnostics
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean assembleDebug > generated-apk/build-1.8.0.log 2>&1
          CODE=$?
          tail -n 360 generated-apk/build-1.8.0.log > generated-apk/build-1.8.0-tail.log
          if [ "$CODE" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add generated-apk/build-1.8.0-tail.log
            git commit -m "Save 深情助手 1.8.0 build error" || true
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$CODE"
          fi

      - name: Prepare downloadable APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ShenqingAssistant-1.8.0-QuizLearning.apk
          sha256sum ShenqingAssistant-1.8.0-QuizLearning.apk > ShenqingAssistant-1.8.0-QuizLearning.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShenqingAssistant-1.8.0-QuizLearning-APK
          path: |
            ShenqingAssistant-1.8.0-QuizLearning.apk
            ShenqingAssistant-1.8.0-QuizLearning.apk.sha256
          if-no-files-found: error
          retention-days: 30
