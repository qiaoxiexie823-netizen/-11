name: Build Windows Quiz Assistant EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "windows-assistant/**"
      - "app/src/main/assets/questions.jsonl"
      - ".github/workflows/build-windows-quiz-assistant.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path generated-pc | Out-Null
          @"
          run_id=$env:GITHUB_RUN_ID
          commit=$env:GITHUB_SHA
          artifact=Shenqing-PC-Quiz-Assistant-2.1.1-NumPyFix-EXE
          "@ | Set-Content -Encoding UTF8 generated-pc/manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-pc/manifest.txt
          git commit -m "Record Windows quiz assistant 2.1.1 build run" 2>$null
          if ($LASTEXITCODE -eq 0) {
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: windows-assistant/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r windows-assistant/requirements.txt

      - name: Apply NumPy-safe OCR parser
        shell: pwsh
        run: |
          python windows-assistant/patch_numpy_ocr_fix.py
          Select-String -Path windows-assistant/main.py -Pattern "APP_VERSION = \"2.1.1\"" -Quiet | Out-Null
          if (!$?) { throw "Version patch was not applied" }
          Select-String -Path windows-assistant/main.py -Pattern "def _sequence" -Quiet | Out-Null
          if (!$?) { throw "NumPy OCR fix was not applied" }

      - name: Verify question bank and source
        shell: pwsh
        run: |
          $count = (Get-Content app/src/main/assets/questions.jsonl | Measure-Object -Line).Lines
          if ($count -lt 3600) { throw "Question bank is incomplete: $count" }
          python -c "import rapidocr, onnxruntime, cv2, mss, cryptography, rapidfuzz; print('imports ok')"
          python -m py_compile windows-assistant/main.py
          Select-String -Path windows-assistant/main.py -Pattern "稳定自动点击" -Quiet | Out-Null
          if (!$?) { throw "Three-mode UI is missing" }
          Select-String -Path windows-assistant/main.py -Pattern "OPTION_CENTERS" -Quiet | Out-Null
          if (!$?) { throw "Answer click calibration is missing" }

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "ShenqingPCQuizAssistant-2.1.1" `
            --add-data "app/src/main/assets/questions.jsonl;." `
            --collect-all rapidocr `
            --collect-all onnxruntime `
            --hidden-import onnxruntime.capi._pybind_state `
            --hidden-import cv2 `
            windows-assistant/main.py

      - name: Prepare download
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ShenqingPCQuizAssistant-2.1.1.exe")) { throw "EXE was not generated" }
          Copy-Item "dist/ShenqingPCQuizAssistant-2.1.1.exe" "深情电脑答题助手-2.1.1识别修复版.exe"
          Get-FileHash "深情电脑答题助手-2.1.1识别修复版.exe" -Algorithm SHA256 | Format-List | Out-File -Encoding UTF8 "深情电脑答题助手-2.1.1识别修复版.exe.sha256.txt"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shenqing-PC-Quiz-Assistant-2.1.1-NumPyFix-EXE
          path: |
            深情电脑答题助手-2.1.1识别修复版.exe
            深情电脑答题助手-2.1.1识别修复版.exe.sha256.txt
          if-no-files-found: error
          retention-days: 30
