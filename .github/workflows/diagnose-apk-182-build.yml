name: Diagnose Android Build
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/diagnose-apk-182-build.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply app patches
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:patchQuizPerformance
          python3 tools/patch_full_auto_quiz_164.py
          python3 tools/patch_quiz_only_learning_180.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/patch_quiz_scope_click_181.py')
          text = path.read_text(encoding='utf-8').replace(
              'page_end = "    private void tryAutoClickAnswer(Text result, QuestionBank.Match match) {"',
              'page_end = "    private void captureOptionTexts(Text result) {"', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/patch_quiz_scope_click_181.py
          python3 tools/patch_quiz_roi_fast_182.py
          python3 tools/patch_question_bank_viewer_183.py
          python3 tools/patch_exact_9691_single.py
      - name: Compile and capture log
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean assembleDebug > build-complete.log 2>&1
          echo $? > build-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Diagnostics
          path: |
            build-complete.log
            build-exit-code.txt
          retention-days: 7
