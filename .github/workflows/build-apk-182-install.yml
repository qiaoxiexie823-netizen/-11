name: Build Shenqing 1.8.5 with 1.8.2 Install Logic

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/build-apk-182-install.yml"
      - "tools/raw_9691_exact_part*.b64"
      - "tools/patch_exact_9691_single.py"

permissions:
  contents: read

jobs:
  build:
    name: 深情助手1.8.5 复用1.8.2安装逻辑
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply the proven 1.8.2 patch sequence
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:patchQuizPerformance
          python3 tools/patch_full_auto_quiz_164.py
          python3 tools/patch_quiz_only_learning_180.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/patch_quiz_scope_click_181.py')
          text = path.read_text(encoding='utf-8').replace(
              'page_end = "    private void tryAutoClickAnswer(Text result, QuestionBank.Match match) {"',
              'page_end = "    private void captureOptionTexts(Text result) {"',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/patch_quiz_scope_click_181.py
          python3 tools/patch_quiz_roi_fast_182.py

      - name: Add question-bank viewer and exact uploaded bank
        shell: bash
        run: |
          python3 tools/patch_question_bank_viewer_183.py
          python3 tools/patch_exact_9691_single.py

          BANK_COUNT=$(grep -cve '^$' app/src/main/assets/questions.jsonl)
          test "$BANK_COUNT" -eq 9691
          BANK_SHA=$(sha256sum app/src/main/assets/questions.jsonl | awk '{print $1}')
          test "$BANK_SHA" = "33b8057b19c24680ac7ceb32c55637ec931c367d64660536fb0b653d80448d11"
          cat generated-apk/question-bank-count.txt

      - name: Set the real internal version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text, count1 = re.subn(r'versionCode\s+\d+', 'versionCode 21', text, count=1)
          text, count2 = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.8.5"', text, count=1)
          if count1 != 1 or count2 != 1:
              raise RuntimeError('无法写入APK内部版本')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify essential app structure
        shell: bash
        run: |
          test -f app/src/main/java/com/ruisi/changanmatch/QuizActivity.java
          test -f app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java
          test -f app/src/main/java/com/ruisi/changanmatch/QuizRegionOverlayService.java
          test -f app/src/main/java/com/ruisi/changanmatch/QuestionBankViewerActivity.java
          grep -q 'addTabButton(tabs, "答题器"' app/src/main/java/com/ruisi/changanmatch/MainActivity.java
          grep -q 'addTabButton(tabs, "卡密"' app/src/main/java/com/ruisi/changanmatch/MainActivity.java
          grep -q 'android:name=".QuestionBankViewerActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".QuizRegionOverlayService"' app/src/main/AndroidManifest.xml
          if grep -q 'addTabButton(tabs, "消消乐"' app/src/main/java/com/ruisi/changanmatch/MainActivity.java; then
            echo '仍存在消消乐入口' >&2
            exit 1
          fi
          if grep -q 'android:name=".ScreenCaptureService"' app/src/main/AndroidManifest.xml; then
            echo '仍注册消消乐屏幕服务' >&2
            exit 1
          fi
          if grep -q '当前版本只保留答题器和卡密' app/src/main/java/com/ruisi/changanmatch/MainActivity.java; then
            echo '仍显示版本修改说明' >&2
            exit 1
          fi

      - name: Build directly with Gradle like 1.8.2
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK package version alignment and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" >/dev/null
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 12 | tee apk-metadata.txt
          grep -q "package: name='com.ruisi.changanmatch'" apk-metadata.txt
          grep -q "versionCode='21'" apk-metadata.txt
          grep -q "versionName='1.8.5'" apk-metadata.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signing-verification.txt

      - name: Prepare artifact
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ShenqingAssistant-1.8.5-Using182InstallLogic.apk
          sha256sum ShenqingAssistant-1.8.5-Using182InstallLogic.apk > ShenqingAssistant-1.8.5-Using182InstallLogic.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShenqingAssistant-1.8.5-Using182InstallLogic-APK
          path: |
            ShenqingAssistant-1.8.5-Using182InstallLogic.apk
            ShenqingAssistant-1.8.5-Using182InstallLogic.apk.sha256
            generated-apk/question-bank-count.txt
            apk-metadata.txt
            signing-verification.txt
          if-no-files-found: error
          retention-days: 30
