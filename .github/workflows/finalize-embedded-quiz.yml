name: Finalize Embedded Quiz Assistant 1.6.0

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/finalize-embedded-quiz.yml"

permissions:
  contents: write

jobs:
  finalize-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import embedded quiz files from feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/embed-quiz-bank:refs/remotes/origin/feature/embed-quiz-bank
          mkdir -p app/src/main/java/com/ruisi/changanmatch app/src/main/assets generated-apk
          for FILE in \
            app/src/main/java/com/ruisi/changanmatch/QuestionBank.java \
            app/src/main/java/com/ruisi/changanmatch/QuizActivity.java \
            app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java \
            app/src/main/assets/questions.jsonl \
            app/src/main/assets/questions.info \
            app/src/main/AndroidManifest.xml \
            app/build.gradle \
            gradle.properties
          do
            git show "origin/feature/embed-quiz-bank:$FILE" > "$FILE"
          done
          test "$(wc -l < app/src/main/assets/questions.jsonl)" -ge 3600
          printf 'run_id=%s\nsource_branch=feature/embed-quiz-bank\nquestions=%s\n' \
            "$GITHUB_RUN_ID" "$(wc -l < app/src/main/assets/questions.jsonl)" \
            > generated-apk/manifest.txt

      - name: Connect top quiz tab to internal activity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ruisi/changanmatch/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          start = text.index('    private void renderQuizTab(LinearLayout root) {')
          end = text.index('    private void activateOfflineLicense(EditText input, TextView status) {')
          replacement = '''    private void renderQuizTab(LinearLayout root) {
              LinearLayout card = verticalCard(Color.WHITE, 20);
              card.setPadding(dp(18), dp(18), dp(18), dp(18));
              root.addView(card, cardParams());

              TextView title = text("长安题库答题器", 21, PURPLE_DARK);
              title.setGravity(Gravity.CENTER);
              card.addView(title, fullWidth());

              TextView description = text(
                      "已内置 3603 道《长安幻想》题库和中文 OCR。识题、查题和答案匹配全部在手机本地完成，不上传题目内容。",
                      14, TEXT_MUTED);
              description.setGravity(Gravity.CENTER);
              description.setLineSpacing(0, 1.2f);
              description.setPadding(0, dp(10), 0, dp(12));
              card.addView(description, fullWidth());

              TextView bankState = text("题库状态：已内置 3603 道", 13, GREEN);
              bankState.setGravity(Gravity.CENTER);
              bankState.setPadding(dp(10), dp(6), dp(10), dp(6));
              bankState.setBackground(roundRect(Color.rgb(237, 249, 242), 15));
              card.addView(bankState, withMargins(fullWidth(), dp(4)));

              Button openButton = primaryButton("进入内置答题器");
              openButton.setOnClickListener(v -> openQuizAssistant());
              card.addView(openButton, buttonParams());

              TextView note = text(
                      "进入后可先输入“浪里白条”手动测试，也可授权悬浮窗并启动屏幕识题。无需安装第二个 App。",
                      13, TEXT_MUTED);
              note.setGravity(Gravity.CENTER);
              note.setPadding(dp(5), dp(10), dp(5), 0);
              card.addView(note, fullWidth());
          }

          private void openQuizAssistant() {
              startActivity(new Intent(this, QuizActivity.class));
          }

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit 1.6.0 integration to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ruisi/changanmatch/QuestionBank.java \
                  app/src/main/java/com/ruisi/changanmatch/QuizActivity.java \
                  app/src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java \
                  app/src/main/java/com/ruisi/changanmatch/MainActivity.java \
                  app/src/main/assets/questions.jsonl \
                  app/src/main/assets/questions.info \
                  app/src/main/AndroidManifest.xml app/build.gradle gradle.properties \
                  generated-apk/manifest.txt
          git commit -m "Release embedded 3603-question quiz assistant 1.6.0"
          git push origin HEAD:main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build 深情助手 1.6.0
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ShenqingAssistant-1.6.0-debug.apk
          sha256sum ShenqingAssistant-1.6.0-debug.apk > ShenqingAssistant-1.6.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShenqingAssistant-1.6.0-APK
          path: |
            ShenqingAssistant-1.6.0-debug.apk
            ShenqingAssistant-1.6.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
