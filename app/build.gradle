plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ruisi.changanmatch'
    compileSdk 35

    defaultConfig {
        applicationId "com.ruisi.changanmatch"
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName "1.6.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 中文 OCR 模型随 APK 打包，运行时不下载、不上传识别内容。
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}

// 在编译前把顶部“答题器”按钮连接到同一 APK 内的 QuizActivity。
def patchEmbeddedQuizEntry = tasks.register('patchEmbeddedQuizEntry') {
    doLast {
        File source = file('src/main/java/com/ruisi/changanmatch/MainActivity.java')
        String text = source.getText('UTF-8')
        if (text.contains('startActivity(new Intent(this, QuizActivity.class));')) return

        String startMarker = '    private void renderQuizTab(LinearLayout root) {'
        String endMarker = '    private void activateOfflineLicense(EditText input, TextView status) {'
        int start = text.indexOf(startMarker)
        int end = text.indexOf(endMarker)
        if (start < 0 || end <= start) throw new GradleException('无法定位答题器入口代码')

        String replacement = '''    private void renderQuizTab(LinearLayout root) {
        LinearLayout card = verticalCard(Color.WHITE, 20);
        card.setPadding(dp(18), dp(18), dp(18), dp(18));
        root.addView(card, cardParams());

        TextView title = text("长安题库答题器", 21, PURPLE_DARK);
        title.setGravity(Gravity.CENTER);
        card.addView(title, fullWidth());

        TextView description = text(
                "已内置 3603 道《长安幻想》题库和中文 OCR。识题、查题和答案匹配全部在手机本地完成，不上传题目内容。",
                14, TEXT_MUTED);
        description.setGravity(Gravity.CENTER);
        description.setLineSpacing(0, 1.2f);
        description.setPadding(0, dp(10), 0, dp(12));
        card.addView(description, fullWidth());

        TextView bankState = text("题库状态：已内置 3603 道", 13, GREEN);
        bankState.setGravity(Gravity.CENTER);
        bankState.setPadding(dp(10), dp(6), dp(10), dp(6));
        bankState.setBackground(roundRect(Color.rgb(237, 249, 242), 15));
        card.addView(bankState, withMargins(fullWidth(), dp(4)));

        Button openButton = primaryButton("进入内置答题器");
        openButton.setOnClickListener(v -> openQuizAssistant());
        card.addView(openButton, buttonParams());

        TextView note = text(
                "进入后可先输入“浪里白条”手动测试，也可授权悬浮窗并启动屏幕识题。无需安装第二个 App。",
                13, TEXT_MUTED);
        note.setGravity(Gravity.CENTER);
        note.setPadding(dp(5), dp(10), dp(5), 0);
        card.addView(note, fullWidth());
    }

    private void openQuizAssistant() {
        startActivity(new Intent(this, QuizActivity.class));
    }

'''
        source.write(text.substring(0, start) + replacement + text.substring(end), 'UTF-8')
    }
}

// 1.6.2：降低 OCR 图像尺寸和识别间隔，保留最新画面，及时清除上一题状态。
def patchQuizPerformance = tasks.register('patchQuizPerformance') {
    doLast {
        File serviceFile = file('src/main/java/com/ruisi/changanmatch/QuizScreenCaptureService.java')
        String service = serviceFile.getText('UTF-8')

        if (!service.contains('OCR_INTERVAL_MS')) {
            service = service.replace(
                    '    private static final int NOTIFICATION_ID = 8232;\n',
                    '    private static final int NOTIFICATION_ID = 8232;\n' +
                    '    private static final long OCR_INTERVAL_MS = 420L;\n' +
                    '    private static final long CLICK_COOLDOWN_MS = 650L;\n' +
                    '    private static final int OCR_MAX_WIDTH = 1080;\n')
            service = service.replace(
                    '    private final AtomicBoolean processing = new AtomicBoolean(false);\n',
                    '    private final AtomicBoolean processing = new AtomicBoolean(false);\n' +
                    '    private volatile boolean pendingLatestFrame;\n')
            service = service.replace(
                    '    private String lastClickedQuestion = "";\n',
                    '    private String lastClickedQuestion = "";\n' +
                    '    private int consecutiveMisses;\n')

            String imageStartMarker = '    private void onImageAvailable(ImageReader reader) {'
            String imageEndMarker = '    private Bitmap imageToBitmap(Image image) {'
            int imageStart = service.indexOf(imageStartMarker)
            int imageEnd = service.indexOf(imageEndMarker)
            if (imageStart < 0 || imageEnd <= imageStart) {
                throw new GradleException('无法定位 OCR 取帧代码')
            }
            String imageReplacement = '''    private void onImageAvailable(ImageReader reader) {
        if (reader == null) return;
        long now = System.currentTimeMillis();
        if (processing.get() || now - lastProcessAt < OCR_INTERVAL_MS) {
            pendingLatestFrame = true;
            Image stale = reader.acquireLatestImage();
            if (stale != null) stale.close();
            return;
        }

        Image image = reader.acquireLatestImage();
        if (image == null) return;
        processing.set(true);
        pendingLatestFrame = false;
        lastProcessAt = now;

        Bitmap bitmap = null;
        try {
            bitmap = imageToBitmap(image);
        } catch (Exception ignored) {
        } finally {
            image.close();
        }
        if (bitmap == null) {
            processing.set(false);
            scheduleLatestFrame();
            return;
        }

        Bitmap prepared = prepareBitmap(bitmap);
        if (prepared != bitmap) bitmap.recycle();
        InputImage inputImage = InputImage.fromBitmap(prepared, 0);
        Task<Text> task = recognizer.process(inputImage);
        task.addOnSuccessListener(this::handleOcrResult)
                .addOnFailureListener(error -> updateOverlay("识别失败，正在重试…"))
                .addOnCompleteListener(done -> {
                    prepared.recycle();
                    processing.set(false);
                    scheduleLatestFrame();
                });
    }

    private void scheduleLatestFrame() {
        if (!pendingLatestFrame || captureHandler == null || imageReader == null) return;
        pendingLatestFrame = false;
        long delay = Math.max(5L, OCR_INTERVAL_MS -
                (System.currentTimeMillis() - lastProcessAt));
        captureHandler.postDelayed(() -> onImageAvailable(imageReader), delay);
    }

'''
            service = service.substring(0, imageStart) + imageReplacement +
                    service.substring(imageEnd)

            service = service.replace(
                    '        int top = centerOnly ? Math.round(source.getHeight() * 0.12f) : 0;\n' +
                    '        int bottom = centerOnly\n' +
                    '                ? Math.round(source.getHeight() * 0.90f)\n',
                    '        int top = centerOnly ? Math.round(source.getHeight() * 0.08f) : 0;\n' +
                    '        int bottom = centerOnly\n' +
                    '                ? Math.round(source.getHeight() * 0.92f)\n')
            service = service.replace('        int maxWidth = 1600;\n',
                    '        int maxWidth = OCR_MAX_WIDTH;\n')

            String resultStartMarker = '    private void handleOcrResult(Text result) {'
            String resultEndMarker = '    private void tryAutoClickAnswer(Text result, QuestionBank.Match match) {'
            int resultStart = service.indexOf(resultStartMarker)
            int resultEnd = service.indexOf(resultEndMarker)
            if (resultStart < 0 || resultEnd <= resultStart) {
                throw new GradleException('无法定位 OCR 结果代码')
            }
            String resultReplacement = '''    private void handleOcrResult(Text result) {
        List<String> lines = new ArrayList<>();
        for (Text.TextBlock block : result.getTextBlocks()) {
            for (Text.Line line : block.getLines()) {
                String value = line.getText().trim();
                if (!value.isEmpty()) lines.add(value);
            }
        }

        QuestionBank.Match match = questionBank.findBest(lines, result.getText());
        if (match == null) {
            consecutiveMisses++;
            if (consecutiveMisses >= 2) {
                lastQuestion = "";
                lastClickedQuestion = "";
                updateOverlay(autoClick
                        ? "正在识别下一题…\\n自动点击已开启"
                        : "正在识别下一题…\\n长按悬浮窗停止");
            }
            return;
        }

        consecutiveMisses = 0;
        if (!match.question.equals(lastQuestion)) {
            lastQuestion = match.question;
            lastClickedQuestion = "";
            updateOverlay("答案：" + match.answer +
                    "\\n匹配 " + Math.round(match.score * 100) + "%" +
                    (autoClick ? " · 等待点击" : ""));
        }

        if (autoClick) tryAutoClickAnswer(result, match);
    }

'''
            service = service.substring(0, resultStart) + resultReplacement +
                    service.substring(resultEnd)

            service = service.replace('now - lastClickAt < 1200L',
                    'now - lastClickAt < CLICK_COOLDOWN_MS')
            service = service.replace(
                    '            updateOverlay("答案：" + match.answer + "\\n已自动点击：" + target.text);',
                    '            updateOverlay("答案：" + match.answer + "\\n已自动点击");')
            service = service.replace(
                    '                            WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,',
                    '                            WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN |\n' +
                    '                            WindowManager.LayoutParams.FLAG_SECURE,')
            serviceFile.write(service, 'UTF-8')
        }

        File bankFile = file('src/main/java/com/ruisi/changanmatch/QuestionBank.java')
        String bank = bankFile.getText('UTF-8')
        if (!bank.contains('int lineCount = Math.min(lines.size(), 24);')) {
            String segmentStartMarker = '    private List<String> makeSegments(List<String> lines, String fullText) {'
            String matchStartMarker = '    private Match matchSegment(String rawSegment) {'
            int segmentStart = bank.indexOf(segmentStartMarker)
            int matchStart = bank.indexOf(matchStartMarker)
            if (segmentStart < 0 || matchStart <= segmentStart) {
                throw new GradleException('无法定位题库分段代码')
            }
            String segmentReplacement = '''    private List<String> makeSegments(List<String> lines, String fullText) {
        List<String> output = new ArrayList<>();
        int lineCount = Math.min(lines.size(), 24);
        for (int i = 0; i < lineCount && output.size() < 60; i++) {
            String current = lines.get(i);
            if (normalize(current).length() < 2) continue;
            output.add(current);
            if (i + 1 < lineCount && output.size() < 60) {
                output.add(current + lines.get(i + 1));
            }
            if (i + 2 < lineCount && output.size() < 60) {
                output.add(current + lines.get(i + 1) + lines.get(i + 2));
            }
        }
        if (fullText != null && fullText.length() <= 360 && output.size() < 60) {
            output.add(fullText);
        }
        return output;
    }

'''
            bank = bank.substring(0, segmentStart) + segmentReplacement +
                    bank.substring(matchStart)

            matchStart = bank.indexOf(matchStartMarker)
            String normalizeMarker = '    public static String normalize(String input) {'
            int normalizeStart = bank.indexOf(normalizeMarker)
            if (matchStart < 0 || normalizeStart <= matchStart) {
                throw new GradleException('无法定位题库匹配代码')
            }
            String matchReplacement = '''    private Match matchSegment(String rawSegment) {
        String segment = normalize(rawSegment);
        if (segment.length() < 2) return null;

        Set<String> segmentGrams = grams(segment);
        Map<Integer, Integer> overlapCount = new HashMap<>();
        for (String gram : segmentGrams) {
            List<Integer> ids = gramIndex.get(gram);
            if (ids == null) continue;
            for (Integer id : ids) overlapCount.merge(id, 1, Integer::sum);
        }
        if (overlapCount.isEmpty()) return null;

        Match contained = null;
        for (Integer id : overlapCount.keySet()) {
            Entry entry = entries.get(id);
            if (entry.normalized.length() >= 3 && segment.contains(entry.normalized)) {
                double score = 0.998 + Math.min(0.001,
                        entry.normalized.length() / 10000.0);
                if (contained == null || entry.normalized.length() >
                        normalize(contained.question).length()) {
                    contained = new Match(entry.question, entry.answer, score);
                }
            }
        }
        if (contained != null) return contained;

        if (segment.length() >= 4) {
            Match partial = null;
            for (Integer id : overlapCount.keySet()) {
                Entry entry = entries.get(id);
                if (entry.normalized.contains(segment)) {
                    double ratio = segment.length() /
                            (double) Math.max(1, entry.normalized.length());
                    double score = Math.min(0.96, 0.78 + ratio * 0.18);
                    if (partial == null || score > partial.score) {
                        partial = new Match(entry.question, entry.answer, score);
                    }
                }
            }
            if (partial != null) return partial;
        }

        List<Map.Entry<Integer, Integer>> candidates =
                new ArrayList<>(overlapCount.entrySet());
        candidates.sort((left, right) ->
                Integer.compare(right.getValue(), left.getValue()));

        Match best = null;
        int limit = Math.min(100, candidates.size());
        for (int i = 0; i < limit; i++) {
            Map.Entry<Integer, Integer> count = candidates.get(i);
            Entry entry = entries.get(count.getKey());
            if (entry.normalized.length() < 3) continue;
            double dice = (2.0 * count.getValue()) /
                    Math.max(1, entry.grams.size() + segmentGrams.size());
            double lengthRatio = Math.min(entry.normalized.length(), segment.length()) /
                    (double) Math.max(entry.normalized.length(), segment.length());
            double edit = similarity(entry.normalized, segment);
            double score = Math.max(dice,
                    dice * 0.56 + edit * 0.34 + lengthRatio * 0.10);

            if (entry.normalized.length() >= 8) {
                String head = entry.normalized.substring(0, 4);
                String tail = entry.normalized.substring(entry.normalized.length() - 4);
                if (segment.contains(head)) score += 0.06;
                if (segment.contains(tail)) score += 0.06;
            }
            score = Math.min(0.997, score);
            if (best == null || score > best.score) {
                best = new Match(entry.question, entry.answer, score);
            }
        }
        return best;
    }

'''
            bank = bank.substring(0, matchStart) + matchReplacement +
                    bank.substring(normalizeStart)
            bankFile.write(bank, 'UTF-8')
        }
    }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn patchEmbeddedQuizEntry
        dependsOn patchQuizPerformance
    }
}
